# Blueprint MP Config - 20BB 6-max, 500/100/100 postflop buckets, simplified actions
# Uses the full-run training schedule with the 500f_100t_100r_v1 bucket files.
game:
  name: "6-max 20bb simplified actions 500f 100t 100r"
  num_players: 6
  stack_depth: 40
  blinds:
    - seat: 4
      type: small_blind
      amount: 1
    - seat: 5
      type: big_blind
      amount: 2

clustering:
  preflop:
    buckets: 169
  flop:
    buckets: 500
  turn:
    buckets: 100
  river:
    buckets: 100

action_abstraction:
  preflop:
    lead: ["2bb"]
    raise:
      - ["0.33x", "1.0x"]
      - ["0.33x", "1.0x"]
  flop:
    lead: [0.33, 0.75, 1.0]
    raise:
      - [0.33, 0.75, 1.0]
  turn:
    lead: [0.5, 1.0]
    raise:
      - [0.5, 1.0]
  river:
    lead: [0.5, 1.0]
    raise:
      - [0.5, 1.0]

training:
  cluster_path: "./local_data/buckets/500f_100t_100r_v1"
  time_limit_minutes: 7200
  lcfr_warmup_iterations: 300000
  prune_after_iterations: 100000
  prune_threshold: -50
  batch_size: 2000
  dcfr_alpha: 1.5
  dcfr_beta: 0.0
  dcfr_gamma: 2.0
  exploitability_interval_minutes: 30
  exploitability_samples: 10000

snapshots:
  resume: true
  warmup_minutes: 60
  snapshot_every_minutes: 30
  output_dir: "./local_data/blueprints/mp_6max_20bb_simplified_actions_500f_100t_100r_v1"

tui:
  enabled: true
  refresh_rate_ms: 2000
  telemetry:
    strategy_delta_interval_seconds: 120
    sparkline_window: 60
  scenarios:
    - name: "UTG open"
      spot: ""
    - name: "HJ open"
      spot: "utg:fold"
    - name: "CO open"
      spot: "utg:fold,hj:fold"
    - name: "BTN open"
      spot: "utg:fold,hj:fold,co:fold"
    - name: "SB open"
      spot: "utg:fold,hj:fold,co:fold,btn:fold"
    - name: "BB vs limp"
      spot: "utg:fold,hj:fold,co:fold,btn:fold,sb:call"
