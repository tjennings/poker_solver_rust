# Turn-boundary CFVNet training config.
#
# Train:
#   cd crates/cfvnet/python
#   uv run python scripts/train_boundary.py \
#     -c ../../../sample_configurations/turn_boundary_cfvnet.yaml \
#     -d ../../../local_data/cfvnet/turn_boundary/v2 \
#     -o ../../../local_data/models/turn_boundary_cfvnet_v2
#
# The trainer enforces datagen.street=turn_boundary and game.board_size=4 when
# loading a manifest-backed dataset.

game:
  initial_stack: 200
  bet_sizes:
    - ["25%", "50%", "100%", "a"]
    - ["25%", "75%", "a"]
  board_size: 4

datagen:
  street: "turn_boundary"
  turn_boundary_target_source: "river_net"

training:
  hidden_layers: 7
  hidden_size: 768
  batch_size: 16384
  epochs: 2000
  learning_rate: 0.004
  lr_min: 0.00004
  huber_delta: 1.0
  aux_loss_weight: 0.00001
  validation_split: 0.05
  checkpoint_every_n_epochs: 25
  shuffle_buffer_size: 262144
  prefetch_depth: 4
  encoder_threads: 14
  gpu_prefetch: 3
  grad_clip_norm: 1.0
