game:
  name: HU simplified actions 50f 50t 50r
  num_players: 2
  stack_depth: 200.0
  allow_preflop_limp: false
  blinds:
  - seat: 0
    type: small_blind
    amount: 1.0
  - seat: 1
    type: big_blind
    amount: 2.0
  rake_rate: 0.0
  rake_cap: 0.0
action_abstraction:
  max_flop_players: 2
  preflop:
    lead:
    - 2bb
    raise:
    - - 1.0x
      - 3.0x
    - - 1.0x
      - 3.0x
    - - 0.33x
      - 0.75x
      - 1.0x
      - 3.0x
  flop:
    lead:
    - 0.25
    - 0.5
    - 0.75
    raise:
    - - 0.5
      - 1.0
    - - 0.5
      - 1.0
  turn:
    lead:
    - 0.25
    - 0.5
    - 0.75
    raise:
    - - 0.5
      - 1.0
    - - 0.5
      - 1.0
  river:
    lead:
    - 0.25
    - 0.5
    - 0.75
    raise:
    - - 0.5
      - 1.0
      - 1.5
    - - 0.5
      - 1.0
      - 1.5
clustering:
  preflop:
    buckets: 169
  flop:
    buckets: 50
  turn:
    buckets: 50
  river:
    buckets: 50
training:
  backend: lazy_sparse
  chance_continuation_mode: sampled_full_deal
  cluster_path: ./local_data/buckets/50f_50t_50r_nut_high_cap_0p5_v1
  iterations: 400000000
  time_limit_minutes: 7200
  lcfr_warmup_iterations: 3000000
  lcfr_discount_interval: 3000000
  prune_after_iterations: 4000000
  traversal_pruning_enabled: true
  prune_threshold: -1
  prune_explore_pct: 0.05
  negative_action_subtree_purge_enabled: false
  negative_action_prune_below: -100
  negative_action_reactivate_at: 0
  negative_action_purge_mode: scan_history_prefix
  batch_size: 500
  dcfr_alpha: 1.5
  dcfr_beta: 0.0
  dcfr_gamma: 2.0
  print_every_minutes: 10
  purify_threshold: 0.0
  exploitability_interval_minutes: 30
  exploitability_samples: 10000
snapshots:
  warmup_minutes: 60
  snapshot_every_minutes: 30
  output_dir: ./local_data/blueprints/mp_hu_50f_50t_50r_nut_high_cap_0p5_v1
  resume: false
  max_snapshots: null
  format: both
tui:
  enabled: true
  refresh_rate_ms: 2000
  telemetry:
    strategy_delta_interval_seconds: 120
    sparkline_window: 60
  scenarios:
    - name: "SB Open"
      spot: ""
    - name: "BB 3-bet"
      spot: "sb:2bb"
    - name: "SB 4-bet"
      spot: "sb:2bb,bb:6bb"
