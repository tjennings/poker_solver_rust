# Blueprint V2 clustering config: 50/50/50 with high nut-distance weight capped at 0.5 normalized units.
game:
  name: "shared 50f 50t 50r buckets nut high cap 0p5"
  players: 2
  stack_depth: 40
  small_blind: 1
  big_blind: 2

clustering:
  algorithm: potential_aware_emd
  preflop:
    buckets: 169
  flop:
    buckets: 50
    metric:
      enabled: true
      potential_weight: 0.0
      equity_weight: 1.0
      nut_distance_weight: 0.50
      nut_distance_cap: 0.5
      nut_sample_boards: 500
  turn:
    buckets: 50
    sample_boards: 16432
    metric:
      enabled: true
      potential_weight: 0.0
      equity_weight: 1.0
      nut_distance_weight: 0.50
      nut_distance_cap: 0.5
      nut_sample_boards: 500
  river:
    buckets: 50
    sample_boards: 500000

action_abstraction:
  preflop:
    - ["2bb"]
  flop:
    - [0.33]
  turn:
    - [0.5]
  river:
    - [0.5]

training:
  cluster_path: "./local_data/buckets/50f_50t_50r_nut_high_cap_0p5_v1"
  time_limit_minutes: 7200
  lcfr_warmup_iterations: 300000
  prune_after_iterations: 100000
  prune_threshold: -50
  batch_size: 2000

snapshots:
  resume: true
  warmup_minutes: 60
  snapshot_every_minutes: 30
  output_dir: "./local_data/blueprints/shared_50f_50t_50r_nut_high_cap_0p5"
