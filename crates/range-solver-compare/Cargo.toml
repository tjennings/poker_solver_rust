[workspace]

[package]
name = "range-solver-compare"
version = "0.1.0"
edition = "2021"

[dependencies]
range-solver = { path = "../range-solver" }
# Reference checkout expected beside this repo: ../../../postflop-solver.
# On toolchains where that checkout trips `dangerous_implicit_autorefs`, run
# this harness with `RUSTFLAGS="-A dangerous-implicit-autorefs"` instead of
# adding repo-wide lint suppression.
postflop-solver = { path = "../../../postflop-solver", default-features = false, features = ["rayon"] }
rand = "0.8"
rand_chacha = "0.3"
